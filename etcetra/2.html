<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFi Hotspot Packages</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <!-- Main container gets an id so we can reliably hide/show it -->
    <div id="main-container" class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center">Choose Your WiFi Package</h1>

        <!-- Package List -->
        <div id="package-list" class="space-y-3">
            <!-- Default Visible Packages (include packageId as third argument) -->
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('10','1 device 3hrs', 1)">
                Ksh 10 • 1 device • 3 hrs
            </button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('15','1 device 5hrs', 2)">
                Ksh 15 • 1 device • 5 hrs
            </button>
        </div>

        <!-- More Packages Button -->
        <button id="show-more-btn" class="w-full p-3 bg-gray-800 text-white rounded-xl" onclick="toggleMore()">
            More Packages
        </button>

        <!-- Hidden Packages -->
        <div id="more-packages" class="space-y-3 hidden">
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('20','1 device 8hrs', 3)">
                Ksh 20 • 1 device • 8 hrs
            </button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('30','1 device 12hrs', 4)">
                Ksh 30 • 1 device • 12 hrs
            </button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('50','1 device 24hrs', 5)">
                Ksh 50 • 1 device • 24 hrs
            </button>
        </div>

        <!-- Reconnect Button -->
        <button class="w-full p-3 bg-green-600 text-white rounded-xl" onclick="openReconnect()">
            Reconnect
        </button>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-4">
            <h2 id="payment-title" class="text-xl font-semibold text-center"></h2>

            <input id="phone-input" type="text" placeholder="Enter Phone Number"
                class="w-full p-3 border rounded-xl" />

            <div class="flex gap-3">
                <button id="pay-now-btn" onclick="submitPayment()" class="flex-1 p-3 bg-blue-600 text-white rounded-xl">Pay Now</button>
                <button onclick="closeModal()" class="flex-1 p-3 bg-gray-300 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Reconnect Modal -->
    <div id="reconnect-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-4">
            <h2 class="text-xl font-semibold text-center">Reconnect to WiFi</h2>

            <input id="reconnect-phone" type="text" placeholder="Phone Number" class="w-full p-3 border rounded-xl" />
            <input id="reconnect-password" type="password" placeholder="Password" class="w-full p-3 border rounded-xl" />

            <div class="flex gap-3">
                <button class="flex-1 p-3 bg-green-600 text-white rounded-xl" onclick="submitReconnect()">Reconnect</button>
                <button onclick="closeReconnect()" class="flex-1 p-3 bg-gray-300 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Toggle visibility of the hidden package section
        function toggleMore() {
            const more = document.getElementById('more-packages');
            more.classList.toggle('hidden');

            const less = document.getElementById('package-list');
            less.classList.toggle('hidden')

           // document.getElementById('show-more-btn').innerText = 'less packages'
        }
        let selectedPackage = {};

        // Open payment modal and hide the main page
        function openPayment(amount, details, packageId) {
            // make sure packageId is provided
            if (typeof packageId === 'undefined') packageId = null;

            selectedPackage = { amount, details, packageId };
            document.getElementById('payment-title').innerText = `Pay Ksh ${amount} — ${details}`;

            // Hide main container when modal is open
            document.getElementById('main-container').classList.add('hidden');

            const modal = document.getElementById('payment-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // focus the phone input for quick typing
            setTimeout(() => document.getElementById('phone-input').focus(), 50);
        }

        // Close payment modal and show the main page again
        function closeModal() {
            const modal = document.getElementById('payment-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            document.getElementById('main-container').classList.remove('hidden');

            // clear selected package for safety
            selectedPackage = {};
            document.getElementById('phone-input').value = '';
        }

        // Submit payment to Flask backend as JSON
        async function submitPayment() {
            
            let phone = document.getElementById('phone-input').value.trim();
            if (!phone) {
                alert('Please enter your phone number.');
                document.getElementById('phone-input').focus();
                return;
            }
            // Remove all non-digits
            phone = phone.replace(/\D/g, '');

            // Normalize formats
            if (phone.startsWith("0")) {
                // 0712…  → remove leading 0 → 712… → add 254
                phone = "254" + phone.slice(1);
            } 
            else if (phone.startsWith("254")) {
                // Already starts with 254 (good)
                phone = phone;
            }
            else if (phone.startsWith("7")) {
                // 712… → add 254
                phone = "254" + phone;
            }
            else if (phone.startsWith("2547") === false && phone.startsWith("254") === false) {
                // +254712… or any weird prefix → remove non-digits then fix
                phone = phone.replace(/^254?/, "");
                phone = "254" + phone;
            }

            // Final validation (optional)
            const regex = /^2547\d{8}$/;
            if (!regex.test(phone)) {
                console.error("Invalid phone number format!");
            }

            console.log("Normalized phone:", phone);

            

            // Build payload expected by your backend
            const payload = {
                phone: phone,
                package_id: selectedPackage.packageId,
                amount: selectedPackage.amount
            };

            try {
                // show a quick UI change for loading
                const btn = document.getElementById('pay-now-btn');
                const oldText = btn.innerText;
                btn.disabled = true;
                btn.innerText = 'Processing...';

                const res = await fetch('/buy-package', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                // Basic success handling — adapt based on your API response
                if (res.ok) {
                    alert(data.message || 'Payment request sent successfully.');
                } else {
                    alert(data.error || 'Payment failed.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error: ' + err.message);
            } finally {
                // restore UI
                const btn = document.getElementById('pay-now-btn');
                btn.disabled = false;
                btn.innerText = 'Pay Now';
                closeModal();
            }
        }

        // Open reconnect modal and hide the main page
        function openReconnect() {
            document.getElementById('main-container').classList.add('hidden');

            const modal = document.getElementById('reconnect-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => document.getElementById('reconnect-phone').focus(), 50);
        }

        // Close reconnect modal and show main page
        function closeReconnect() {
            const modal = document.getElementById('reconnect-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            document.getElementById('main-container').classList.remove('hidden');

            document.getElementById('reconnect-phone').value = '';
            document.getElementById('reconnect-password').value = '';
        }

        // Submit reconnect credentials to backend
        async function submitReconnect() {
            const phone = document.getElementById('reconnect-phone').value.trim();
            const pass = document.getElementById('reconnect-password').value;
            if (!phone || !pass) {
                alert('Please enter both phone number and password.');
                return;
            }

            const payload = { phone, password: pass };

            try {
                const res = await fetch('/reconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    alert(data.message || 'Reconnected successfully.');
                } else {
                    alert(data.error || 'Reconnect failed.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error: ' + err.message);
            } finally {
                closeReconnect();
            }
        }
    </script>
</body>
</html>
