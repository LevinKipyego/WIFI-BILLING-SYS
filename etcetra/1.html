<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFi Hotspot Packages</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom Alert Animations */
        .alert-box {
            animation: fadeIn 0.25s ease;
        }
        .alert-hide {
            animation: fadeOut 0.3s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Custom Alert Container -->
    <div id="alert-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-full max-w-md z-50 space-y-2 pointer-events-none"></div>

    <!-- Main container -->
    <div id="main-container" class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center">Choose Your WiFi Package</h1>

        <div id="package-list" class="space-y-3">
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('10','1 device 3hrs', 1)">Ksh 10 • 1 device • 3 hrs</button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('15','1 device 5hrs', 2)">Ksh 15 • 1 device • 5 hrs</button>
        </div>

        <button id="show-more-btn" class="w-full p-3 bg-gray-800 text-white rounded-xl" onclick="toggleMore()">More Packages</button>

        <div id="more-packages" class="space-y-3 hidden">
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('20','1 device 8hrs', 3)">Ksh 20 • 1 device • 8 hrs</button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('30','1 device 12hrs', 4)">Ksh 30 • 1 device • 12 hrs</button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('50','1 device 24hrs', 5)">Ksh 50 • 1 device • 24 hrs</button>
        </div>

        <button class="w-full p-3 bg-green-600 text-white rounded-xl" onclick="openReconnect()">Reconnect</button>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-4">
            <h2 id="payment-title" class="text-xl font-semibold text-center"></h2>

            <input id="phone-input" type="text" placeholder="Enter Phone Number" class="w-full p-3 border rounded-xl" />

            <div class="flex gap-3">
                <button id="pay-now-btn" onclick="submitPayment()" class="flex-1 p-3 bg-blue-600 text-white rounded-xl">Pay Now</button>
                <button onclick="closeModal()" class="flex-1 p-3 bg-gray-300 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Reconnect Modal -->
    <div id="reconnect-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-4">
            <h2 class="text-xl font-semibold text-center">Reconnect to WiFi</h2>

            <input id="reconnect-phone" type="text" placeholder="Phone Number" class="w-full p-3 border rounded-xl" />
            <input id="reconnect-password" type="password" placeholder="Password" class="w-full p-3 border rounded-xl" />

            <div class="flex gap-3">
                <button id="reconnect-btn" class="flex-1 p-3 bg-green-600 text-white rounded-xl" onclick="submitReconnect()">Reconnect</button>
                <button onclick="closeReconnect()" class="flex-1 p-3 bg-gray-300 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        /* ------------------------ CUSTOM ALERT FUNCTION ------------------------ */
        function showAlert(message, type = 'info', options = {}) {
            // options: { autoClose: true|false, duration: ms }
            const colors = {
                success: 'bg-green-600 text-white',
                error: 'bg-red-600 text-white',
                warning: 'bg-yellow-500 text-black',
                info: 'bg-blue-600 text-white'
            };

            const container = document.getElementById('alert-container');
            const alertBox = document.createElement('div');
            alertBox.setAttribute('role', 'alert');
            alertBox.className = `alert-box pointer-events-auto p-4 rounded-xl shadow text-center ${colors[type] || colors.info}`;
            alertBox.style.display = 'block';
            alertBox.style.transition = 'opacity 0.25s ease, transform 0.25s ease';

            // content
            const text = document.createElement('div');
            text.innerText = message;
            alertBox.appendChild(text);

            // close button
            const closeBtn = document.createElement('button');
            closeBtn.innerText = '✕';
            closeBtn.className = 'ml-2 font-bold';
            closeBtn.style.border = 'none';
            closeBtn.style.background = 'transparent';
            closeBtn.style.cursor = 'pointer';
            closeBtn.style.position = 'absolute';
            closeBtn.style.right = '10px';
            closeBtn.style.top = '10px';
            closeBtn.style.fontSize = '14px';
            closeBtn.onclick = () => removeAlert(alertBox);
            alertBox.style.position = 'relative';
            alertBox.appendChild(closeBtn);

            container.appendChild(alertBox);

            // auto-close
            const autoClose = options.autoClose !== undefined ? options.autoClose : true;
            const duration = options.duration || 3500;

            if (autoClose) {
                setTimeout(() => removeAlert(alertBox), duration);
            }

            return alertBox;
        }

        function removeAlert(node) {
            if (!node) return;
            node.classList.add('alert-hide');
            setTimeout(() => { try { node.remove(); } catch (e) {} }, 300);
        }

        /* ------------------------ UI FUNCTIONS ------------------------ */
        function toggleMore() {
            const more = document.getElementById('more-packages');
            more.classList.toggle('hidden');
            const less = document.getElementById('package-list');
            less.classList.toggle('hidden');
        }

        let selectedPackage = {};

        function openPayment(amount, details, packageId) {
            if (typeof packageId === 'undefined') packageId = null;

            selectedPackage = { amount, details, packageId };
            document.getElementById('payment-title').innerText = `Pay Ksh ${amount} — ${details}`;

            document.getElementById('main-container').classList.add('hidden');
            const modal = document.getElementById('payment-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => document.getElementById('phone-input').focus(), 50);
        }

        function closeModal() {
            const modal = document.getElementById('payment-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            document.getElementById('main-container').classList.remove('hidden');
            selectedPackage = {};
            document.getElementById('phone-input').value = '';
        }

        async function submitPayment() {
            let phone = document.getElementById('phone-input').value.trim();
            if (!phone) {
                showAlert('Please enter your phone number.', 'warning');
                document.getElementById('phone-input').focus();
                return;
            }

            // Normalize: remove non-digits and convert to 2547XXXXXXXX
            phone = phone.replace(/\D/g, '');
            if (phone.startsWith('0')) phone = '254' + phone.slice(1);
            else if (phone.startsWith('7')) phone = '254' + phone;
            else if (phone.startsWith('254') && !phone.startsWith('2547')) {
                // malformed like 2541xxxx -> keep as-is (will fail validation)
            } else if (!phone.startsWith('254')) {
                // e.g. +254... handled by remove non-digits above
                phone = '254' + phone;
            }

            const regex = /^2547\d{8}$/;
            if (!regex.test(phone)) {
                showAlert('Invalid phone number format. Use 2547XXXXXXXX', 'error');
                return;
            }

            const payload = {
                phone: phone,
                package_id: selectedPackage.packageId,
                amount: selectedPackage.amount
            };

            try {
                const btn = document.getElementById('pay-now-btn');
                btn.disabled = true;
                btn.innerText = 'Processing...';

                const res = await fetch('/buy-package', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                let data = {};
                try { data = await res.json(); } catch (e) { /* ignore json parse errors */ }

                if (res.ok) showAlert(data.message || 'Payment request sent successfully.', 'success');
                else showAlert((data && data.error) || 'Payment failed.', 'error');

            } catch (err) {
                showAlert('Network error: ' + err.message, 'error');
            } finally {
                const btn = document.getElementById('pay-now-btn');
                btn.disabled = false;
                btn.innerText = 'Pay Now';
                closeModal();
            }
        }

        function openReconnect() {
            document.getElementById('main-container').classList.add('hidden');
            const modal = document.getElementById('reconnect-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => document.getElementById('reconnect-phone').focus(), 50);
        }

        function closeReconnect() {
            const modal = document.getElementById('reconnect-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('reconnect-phone').value = '';
            document.getElementById('reconnect-password').value = '';
        }

        async function submitReconnect() {
            let phone = document.getElementById('reconnect-phone').value.trim();
            const pass = document.getElementById('reconnect-password').value;
            if (!phone || !pass) {
                showAlert('Please enter both phone number and password.', 'warning');
                return;
            }

            // Normalize phone same as payment
            phone = phone.replace(/\D/g, '');
            if (phone.startsWith('0')) phone = '254' + phone.slice(1);
            else if (phone.startsWith('7')) phone = '254' + phone;
            else if (!phone.startsWith('254')) phone = '254' + phone;

            const regex = /^2547\d{8}$/;
            if (!regex.test(phone)) {
                showAlert('Invalid phone number format. Use 2547XXXXXXXX', 'error');
                return;
            }

            const payload = { phone, password: pass };
            try {
                const btn = document.getElementById('reconnect-btn');
                btn.disabled = true;
                btn.innerText = 'Reconnecting...';

                const res = await fetch('/reconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                let data = {};
                try { data = await res.json(); } catch (e) {}

                if (res.ok) showAlert(data.message || 'Reconnected successfully.', 'success');
                else showAlert((data && data.error) || 'Reconnect failed.', 'error');

            } catch (err) {
                showAlert('Network error: ' + err.message, 'error');
            } finally {
                const btn = document.getElementById('reconnect-btn');
                btn.disabled = false;
                btn.innerText = 'Reconnect';
                closeReconnect();
            }
        }
    </script>
</body>
</html>
