<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>levine.net</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <!-- Main container gets an id so we can reliably hide/show it -->
    <div id="main-container" class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center">Choose Your WiFi Package</h1>

        <!-- Package List -->
        <div id="package-list" class="space-y-3">
            <!-- Default Visible Packages -->
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('10','1 device 3hrs')">
                Ksh 10 • 1 device • 3 hrs
            </button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('15','1 device 5hrs')">
                Ksh 15 • 1 device • 5 hrs
            </button>
        </div>

        <!-- More Packages Button -->
        <button id="show-more-btn" class="w-full p-3 bg-gray-800 text-white rounded-xl" onclick="toggleMore()">
            More Packages
        </button>

        <!-- Hidden Packages -->
        <div id="more-packages" class="space-y-3 hidden">
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('20','1 device 8hrs')">
                Ksh 20 • 1 device • 8 hrs
            </button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('30','1 device 12hrs')">
                Ksh 30 • 1 device • 12 hrs
            </button>
            <button class="w-full p-4 bg-blue-600 text-white rounded-xl shadow" onclick="openPayment('50','1 device 24hrs')">
                Ksh 50 • 1 device • 24 hrs
            </button>
        </div>

        <!-- Reconnect Button -->
        <button class="w-full p-3 bg-green-600 text-white rounded-xl" onclick="openReconnect()">
            Reconnect
        </button>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-4">
            <h2 id="payment-title" class="text-xl font-semibold text-center"></h2>

            <input id="phone-input" type="text" placeholder="Enter Phone Number"
                class="w-full p-3 border rounded-xl" />

            <button id="pay-now-btn" onclick="submitPayment()" class="w-full p-3 bg-blue-600 text-white rounded-xl">Pay Now</button>
            <button onclick="closeModal()" class="w-full p-3 bg-gray-300 rounded-xl">Cancel</button>
        </div>
    </div>

    <!-- Reconnect Modal -->
    <div id="reconnect-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-4">
            <h2 class="text-xl font-semibold text-center">Reconnect to WiFi</h2>

            <input id="reconnect-phone" type="text" placeholder="Phone Number" class="w-full p-3 border rounded-xl" />
            <input id="reconnect-password" type="password" placeholder="Password" class="w-full p-3 border rounded-xl" />

            <button class="w-full p-3 bg-green-600 text-white rounded-xl" onclick="submitReconnect()">Reconnect</button>
            <button onclick="closeReconnect()" class="w-full p-3 bg-gray-300 rounded-xl">Cancel</button>
        </div>
    </div>

    <script>
        // Toggle visibility of the hidden package section
        function toggleMore() {
            const more = document.getElementById('more-packages');
            more.classList.toggle('hidden');
        }

        let selectedPackage = {};

        // Open payment modal and hide the main page
        function openPayment(amount, details) {
            selectedPackage = { amount, details };
            document.getElementById('payment-title').innerText = `Pay Ksh ${amount} — ${details}`;

            // Hide main container when modal is open
            document.getElementById('main-container').classList.add('hidden');

            const modal = document.getElementById('payment-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // focus the phone input for quick typing
            setTimeout(() => document.getElementById('phone-input').focus(), 50);
        }

        // Close payment modal and show the main page again
        function closeModal() {
            const modal = document.getElementById('payment-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            document.getElementById('main-container').classList.remove('hidden');

            // clear selected package for safety
            selectedPackage = {};
            document.getElementById('phone-input').value = '';
        }

        // Simulated payment submission — replace with a POST to your Flask endpoint
        function submitPayment() {
            const phone = document.getElementById('phone-input').value.trim();
            if (!phone) {
                alert('Please enter your phone number.');
                document.getElementById('phone-input').focus();
                return;
            }

            // Here you would call your Flask backend (example using fetch):
            // fetch('/buy-package', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ phone, package: selectedPackage }) })
            //   .then(res=>res.json()).then(...)

            alert(`Processing payment of Ksh ${selectedPackage.amount} for ${phone}`);
            closeModal();
        }

        // Open reconnect modal and hide the main page
        function openReconnect() {
            document.getElementById('main-container').classList.add('hidden');

            const modal = document.getElementById('reconnect-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => document.getElementById('reconnect-phone').focus(), 50);
        }

        // Close reconnect modal and show main page
        function closeReconnect() {
            const modal = document.getElementById('reconnect-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            document.getElementById('main-container').classList.remove('hidden');

            document.getElementById('reconnect-phone').value = '';
            document.getElementById('reconnect-password').value = '';
        }

        // Simulated reconnect flow — replace with your actual authentication
        function submitReconnect() {
            const phone = document.getElementById('reconnect-phone').value.trim();
            const pass = document.getElementById('reconnect-password').value;
            if (!phone || !pass) {
                alert('Please enter both phone number and password.');
                return;
            }

            // Example: POST to /reconnect with credentials
            alert(`Attempting reconnect for ${phone}`);
            closeReconnect();
        }
    </script>
</body>
</html>
