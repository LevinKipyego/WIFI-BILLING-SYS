<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*loader*/
.wait-modal {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    color: white;
    text-align: center;
}

/* Loader Dots */
.loader-dots {
    display: flex;
    gap: 8px;
}

.loader-dots::before,
.loader-dots::after,
.loader-dots div {
    content: "";
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    animation: loader-dots 0.6s infinite alternate;
}

.loader-dots::after { animation-delay: 0.2s; }
.loader-dots div      { animation-delay: 0.4s; }

@keyframes loader-dots {
    0% { transform: translateY(0); opacity: 0.5; }
    100% { transform: translateY(-10px); opacity: 1; }
}

    </style>
    <title>Document</title>
</head>
<body>
    <!-- loader -->
    <div id="mpesa-wait-modal" class="hidden wait-modal">
    <div class="loader-dots"></div>
    <p id="countdown-text"></p>
</div>

</body>
</html>
