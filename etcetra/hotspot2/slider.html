<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial;
}

.slider-wrapper {
    position: relative;
    width: 100%;
    height: 350px;
    overflow: hidden;
}

/* BLUR BACKGROUND */
#blur-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(30px) brightness(0.5);
    transition: background-image 0.6s ease;
}

.slider-container {
    position: relative;
    height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.slider-track {
    display: flex;
    gap: 25px;
    align-items: center;
    transition: transform 0.45s ease;
}

/* SLIDE */
.slide {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 15px;
    overflow: hidden;
    opacity: 0.5;
    transform: scale(0.75);
    transition: 0.45s;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* CENTER SLIDE ACTIVE */
.slide.active {
    width: 230px;
    height: 230px;
    opacity: 1;
    transform: scale(1.15);
    z-index: 2;
}

/* CAPTION + BUTTON */
.caption {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    transition: 0.3s;
}

.slide.active .caption {
    opacity: 1;
}

.caption h3 {
    margin: 0;
    font-size: 16px;
}

.caption button {
    margin-top: 5px;
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background: #fff;
    color: #333;
    cursor: pointer;
    font-weight: bold;
}

    </style>
    <title>Document</title>
</head>
<body>
    <div class="slider-wrapper">
    <!-- BLUR BACKGROUND -->
    <div id="blur-bg"></div>

    <div class="slider-container" id="slider">
        <div class="slider-track" id="track">
            <div class="slide" data-caption="Beautiful Lake">
                <img src="img/1.jpg">
                <div class="caption">
                    <h3>Beautiful Lake</h3>
                    <button>View</button>
                </div>
            </div>

            <div class="slide" data-caption="Green Forest">
                <img src="img/2.jpg">
                <div class="caption">
                    <h3>Green Forest</h3>
                    <button>Explore</button>
                </div>
            </div>

            <div class="slide" data-caption="Mountain Peaks">
                <img src="img/3.jpg">
                <div class="caption">
                    <h3>Mountain Peaks</h3>
                    <button>Details</button>
                </div>
            </div>

            <div class="slide" data-caption="Desert Sunset">
                <img src="img/4.jpg">
                <div class="caption">
                    <h3>Desert Sunset</h3>
                    <button>View</button>
                </div>
            </div>

            <div class="slide" data-caption="City Lights">
                <img src="img/5.jpg">
                <div class="caption">
                    <h3>City Lights</h3>
                    <button>More</button>
                </div>
            </div>
        </div>
    </div>
</div>
    <script>
        const track = document.getElementById("track");
const slides = [...document.querySelectorAll(".slide")];
const blurBg = document.getElementById("blur-bg");

let index = 0;
let autoSlideInterval;
let isDragging = false;
let startX = 0;
let currentTranslate = 0;
let prevTranslate = 0;

/* --- UPDATE VIEW --- */
function updateSlider() {
    const offset = -(index * 185);
    track.style.transform = `translateX(${offset}px)`;

    slides.forEach((slide, i) =>
        slide.classList.toggle("active", i === index)
    );

    // update blur background
    const img = slides[index].querySelector("img").src;
    blurBg.style.backgroundImage = `url(${img})`;
}

/* --- AUTO LOOP --- */
function autoPlay() {
    autoSlideInterval = setInterval(() => {
        index = (index + 1) % slides.length;
        updateSlider();
    }, 2500);
}

/* --- DRAG / SWIPE CONTROLS --- */
function startDrag(e) {
    clearInterval(autoSlideInterval);
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    track.style.transition = "none";
}

function dragging(e) {
    if (!isDragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const walk = x - startX;
    track.style.transform = `translateX(${-(index * 185) + walk}px)`;
}

function stopDrag(e) {
    if (!isDragging) return;
    isDragging = false;

    const endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const diff = endX - startX;

    // swipe right
    if (diff > 70 && index > 0) {
        index--;
    }
    // swipe left
    else if (diff < -70 && index < slides.length - 1) {
        index++;
    }

    track.style.transition = "0.45s ease";
    updateSlider();
    autoPlay();
}

/* --- LISTENERS --- */
track.addEventListener("mousedown", startDrag);
track.addEventListener("mousemove", dragging);
track.addEventListener("mouseup", stopDrag);
track.addEventListener("mouseleave", stopDrag);

track.addEventListener("touchstart", startDrag);
track.addEventListener("touchmove", dragging);
track.addEventListener("touchend", stopDrag);

/* --- INIT --- */
updateSlider();
autoPlay();

    </script>
</body>
</html>
